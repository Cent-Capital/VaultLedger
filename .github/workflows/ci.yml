name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev,synth]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Schema import check
        run: python -c "import vaultledger.schemas, vaultledger.config; print('schemas + config import OK')"

      - name: No unbounded loops (SPEC 15.2)
        # Every loop must be bounded; ban `while True` in the package.
        run: |
          if grep -rnE 'while\s+True' vaultledger/; then
            echo "::error::Found 'while True' — loops must be bounded (SPEC 15.2)."
            exit 1
          fi
          echo "loop lint OK"

      - name: Tests
        run: pytest
