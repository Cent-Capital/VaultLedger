# VaultLedger configuration (SPEC.md Appendix B).
# Single source of runtime knobs: seed, budgets, loop caps, thresholds,
# and the model registry / tier map. Code reads this via vaultledger.config.
#
# ADR-0003 retires paid hosted tiers. Phase 18 pins the final two-family by
# three-size local lineup; measured identity/resource fields belong to each
# RunManifest rather than being inferred from these tags.

seed: 42

budgets:
  session_usd: 2.00
  project_usd: 40.00

loops:
  repair_max: 2
  retrieval_retry_max: 1
  escalations_max: 2
  agent_steps_max: 6
  agent_tokens_max: 8192
  agent_output_tokens_max: 768
  # Wall-clock bound (ADR-0007). Step and token budgets do not bound elapsed
  # time: a stalled generator returns nothing, so neither counter advances while
  # the query runs indefinitely. Sized above the observed worst case (6 steps of
  # a slow local model) so it fires on a stall, not on legitimate slowness.
  agent_seconds_max: 300

thresholds:
  rerank_tau: 0.35
  numeric_epsilon: 0.01
  over_refusal_max: 0.05

models:
  T0: { id: "ollama/qwen3:4b" }          # local small: classification, query rewrite
  T1: { id: "ollama/qwen3:8b" }          # local primary (use qwen3:30b-a3b on >=36GB RAM)
  matrix:
    - { id: "ollama/qwen3:4b" }
    - { id: "ollama/qwen3:8b" }
    - { id: "ollama/qwen3:14b" }
    - { id: "ollama/gemma3:1b" }
    - { id: "ollama/gemma3:4b" }
    - { id: "ollama/gemma3:12b" }

matrix:
  variants: ["B_hybrid"]
  smoke_limit: 12             # 0 = full golden set; full six-model sweep is Phase 18
  # Phase 18 pre-registered sweep. The current default (0.0, 0.95) is the
  # canonical qwen3:8b matrix cell and serves as the seventh/baseline cell.
  decoding_sweep_model: "ollama/qwen3:8b"
  decoding_temperatures: [0.3, 0.7]
  decoding_top_ps: [1.0, 0.9, 0.8]

router:                        # Phase 12 deterministic initial-routing policy (ADR-0004)
  t0_categories: ["single_doc", "guardrail_benign"]
  projected_cost_usd: { T0: 0.0, T1: 0.0 }  # unpriced local inference, not free

guardrails:                    # Phase 13 named guards; every switch supports ablation
  file_validation: true
  pii_tagging: true
  injection_scan: true
  query_injection_guard: true
  advice_steer: true
  egress_redaction: true
  citation_verify: true
  numeric_verify: true
  cross_persona_check: true
  advice_linter: true
  max_upload_bytes: 10000000

variant_default: B_hybrid

reranker:
  enabled: true
  model: "BAAI/bge-reranker-base" # cross-encoder; downloaded on first use
  batch_size: 16

retrieval:
  candidate_k: 20                 # candidates from each of dense and BM25
  rrf_constant: 60                # SPEC 9.6 reciprocal-rank-fusion constant
  answer_top_n: 6                 # final context chunks for generation

generation:                       # Phase 5 + Phase 18 typed decoding controls
  temperature: 0.0               # pre-Phase-18 explicit value
  # qwen3:8b's installed Modelfile reports 0.95. Ollama's engine fallback is
  # 0.9, but it was not effective because the model overrides it.
  top_p: 0.95
  top_k: 20                    # fixed sampling control; qwen3:8b installed default is 20
  num_ctx: 8192                  # one host-feasible context window on every generation path
  output_tokens_max: 768         # bound every structured product/eval completion
  request_timeout_seconds: 600   # patience only; load/generation overruns remain TOOL_ERR
  min_snippet_chars: 16           # shortest normalized snippet a citation may carry
  litm_reorder: true              # put highest-value evidence at context edges
  context_budget_chars: 12000     # hard character budget for assembled evidence

embedding:
  model: "nomic-embed-text"          # local via Ollama; changing this invalidates the index
  ollama_url: "http://localhost:11434"

graph:                             # Phase 15, ADR-0008
  engine: "lightrag"
  extraction_model: "ollama/qwen3:8b" # largest installed local model by measured params (8.2B)
  embedding_dim: 768              # measured from `ollama show nomic-embed-text`
  query_mode_default: "global"    # Variant C's global-summary acceptance population
  answer_top_n: 12                # graph fan-out needs broader evidence than B's top 6
  working_dir: "data/graph/lightrag"
  obsidian_dir: "exports/obsidian_vault"
  entity_recall_min: 0.80

chunking:
  max_chars: 2400                    # ~600 tokens at ~4 chars/token (SPEC 8.4: 500-800)
  overlap_frac: 0.15

paths:
  pdfs: "data/synthetic_pdfs"
  ground_truth: "data/ground_truth"
  index_dir: "data/index"            # derived, rebuildable, gitignored
  traces: "data/traces"              # local query traces; contains prompt metadata

live:                                  # Phase 16 user data; ADR-0011 requires external paths
  inbox_dir: "~/VaultLedger/Inbox"
  index_dir: "~/VaultLedger/index"   # extracted text/records stay outside the public repo too
  graph_working_dir: "~/VaultLedger/graph"
  obsidian_dir: "~/VaultLedger/obsidian_vault"
  traces_dir: "~/VaultLedger/traces"
  watcher_poll_seconds: 1.0
  watcher_stable_polls: 2             # two identical size/mtime observations before ingest
  watcher_max_polls: 3600             # bounded: one hour at the default interval
  ocr_timeout_seconds: 300
  graph_timeout_seconds: 900          # hard per-file cap around LightRAG insertion
