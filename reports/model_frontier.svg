<text x="754.9" y="224.7" font-size="12" font-weight="600">qwen3:14b</text>
<text x="754.9" y="240.7" font-size="11" class="mono muted">63.7% · 27.0s · cov 100%</text>
</g>
<g class="data-point" data-model="ollama/qwen3:4b">
<circle cx="184.9" cy="311.6" r="13.7" fill="#2563eb" stroke="#2563eb" stroke-width="3"><title>ollama/qwen3:4b; judge_pass_rate=52.5%; generation coverage=100.0%; median completed-row wall=4007 ms; resident=3.52 GiB</title></circle>
<text x="206.6" y="278.0" font-size="12" font-weight="600">qwen3:4b</text>
<text x="206.6" y="294.0" font-size="11" class="mono muted">52.5% · 4.0s · cov 100%</text>
</g>
<g class="data-point" data-model="ollama/qwen3:8b">
<circle cx="260.9" cy="235.5" r="15.8" fill="#2563eb" stroke="#2563eb" stroke-width="3"><title>ollama/qwen3:8b; judge_pass_rate=70.0%; generation coverage=100.0%; median completed-row wall=7217 ms; resident=6.17 GiB</title></circle>
<text x="284.8" y="199.7" font-size="12" font-weight="600">qwen3:8b</text>
<text x="284.8" y="215.7" font-size="11" class="mono muted">70.0% · 7.2s · cov 100%</text>
</g>
<text x="970" y="113" font-size="12" font-weight="700">Family</text>
<circle cx="977" cy="137" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
<text x="994" y="141" font-size="12">Qwen3</text>
<circle cx="977" cy="163" r="7" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
<text x="994" y="167" font-size="12">Gemma 3</text>
<text x="970" y="210" font-size="12" font-weight="700">Size encoding</text>
<circle cx="982" cy="244" r="12" fill="#ffffff" stroke="#667085" stroke-width="2"/>
<text x="1004" y="248" font-size="11" class="muted">larger bubble =</text>
<text x="1004" y="263" font-size="11" class="muted">more resident bytes</text>
<rect x="70" y="630" width="1040" height="76" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
<text x="90" y="655" font-size="12" font-weight="700">Descriptive only — not a latency ranking</text>
<text x="90" y="677" font-size="11" class="muted">Phase 13 saw ~50% p50 movement between runs with byte-identical answers. Machine load can move points more than the apparent model gap.</text>
<text x="90" y="694" font-size="11" class="muted">Latency uses completed rows only; points below 100% coverage are not comparable on the x axis.</text>
</svg>
