<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.mono{font-family:ui-monospace,SFMono-Regular,monospace}.muted{fill:#667085}.grid{stroke:#e5e7eb;stroke-width:1}.axis{stroke:#344054;stroke-width:1.3}</style>
<text x="90" y="36" font-size="22" font-weight="700">Local-model latency–quality frontier</text>
<text x="90" y="62" font-size="13" class="muted">6 model × decoding cell(s) · bubble area ≈ resident bytes · direct labels identify every point</text>
<line x1="90" y1="540.0" x2="920" y2="540.0" class="grid"/>
<text x="76" y="544.0" font-size="12" text-anchor="end" class="mono muted">0%</text>
<line x1="90" y1="431.2" x2="920" y2="431.2" class="grid"/>
<text x="76" y="435.2" font-size="12" text-anchor="end" class="mono muted">25%</text>
<line x1="90" y1="322.5" x2="920" y2="322.5" class="grid"/>
<text x="76" y="326.5" font-size="12" text-anchor="end" class="mono muted">50%</text>
<line x1="90" y1="213.8" x2="920" y2="213.8" class="grid"/>
<text x="76" y="217.8" font-size="12" text-anchor="end" class="mono muted">75%</text>
<line x1="90" y1="105.0" x2="920" y2="105.0" class="grid"/>
<text x="76" y="109.0" font-size="12" text-anchor="end" class="mono muted">100%</text>
<line x1="90.0" y1="105" x2="90.0" y2="540" class="grid"/>
<text x="90.0" y="564" font-size="12" text-anchor="middle" class="mono muted">0.0s</text>
<line x1="297.5" y1="105" x2="297.5" y2="540" class="grid"/>
<text x="297.5" y="564" font-size="12" text-anchor="middle" class="mono muted">8.8s</text>
<line x1="505.0" y1="105" x2="505.0" y2="540" class="grid"/>
<text x="505.0" y="564" font-size="12" text-anchor="middle" class="mono muted">17.5s</text>
<line x1="712.5" y1="105" x2="712.5" y2="540" class="grid"/>
<text x="712.5" y="564" font-size="12" text-anchor="middle" class="mono muted">26.3s</text>
<line x1="920.0" y1="105" x2="920.0" y2="540" class="grid"/>
<text x="920.0" y="564" font-size="12" text-anchor="middle" class="mono muted">35.0s</text>
<line x1="90" y1="540" x2="920" y2="540" class="axis"/>
<line x1="90" y1="105" x2="90" y2="540" class="axis"/>
<text x="505.0" y="598" font-size="13" text-anchor="middle">Median wall latency per completed row</text>
<text x="25" y="322.5" font-size="13" text-anchor="middle" transform="rotate(-90 25 322.5)">Quality rate</text>
<g class="data-point" data-model="ollama/gemma3:12b">
<circle cx="844.5" cy="224.6" r="16.7" fill="#ffffff" stroke="#d97706" stroke-width="3"><title>ollama/gemma3:12b; judge_pass_rate=72.5%; generation coverage=100.0%; median completed-row wall=31859 ms; resident=7.50 GiB</title></circle>
<text x="819.8" y="187.9" font-size="12" font-weight="600" text-anchor="end">gemma3:12b</text>
<text x="819.8" y="203.9" font-size="11" class="mono muted" text-anchor="end">72.5% · 31.9s · cov 100%</text>
</g>
<g class="data-point" data-model="ollama/gemma3:1b">
<circle cx="134.1" cy="425.8" r="10.2" fill="#ffffff" stroke="#d97706" stroke-width="3"><title>ollama/gemma3:1b; judge_pass_rate=26.2%; generation coverage=100.0%; median completed-row wall=1863 ms; resident=0.83 GiB</title></circle>
<text x="152.4" y="395.6" font-size="12" font-weight="600">gemma3:1b</text>
<text x="152.4" y="411.6" font-size="11" class="mono muted">26.2% · 1.9s · cov 100%</text>
</g>
<g class="data-point" data-model="ollama/gemma3:4b">
<circle cx="199.1" cy="295.3" r="13.8" fill="#ffffff" stroke="#d97706" stroke-width="3"><title>ollama/gemma3:4b; judge_pass_rate=56.2%; generation coverage=100.0%; median completed-row wall=4607 ms; resident=3.62 GiB</title></circle>
<text x="220.9" y="261.6" font-size="12" font-weight="600">gemma3:4b</text>
<text x="220.9" y="277.6" font-size="11" class="mono muted">56.2% · 4.6s · cov 100%</text>
</g>
