<text x="90" y="568" font-size="12" font-weight="700">Read the config hashes before reading the trend</text>
<text x="90" y="588" font-size="11" class="muted">Each snapshot ran under a different pipeline configuration, so a bar that moves carries pipeline drift as well as model behaviour.</text>
<text x="90" y="606" font-size="11" class="muted">Counts are single runs, not repeated measurements: no error bar is available and a small move is not a demonstrated improvement.</text>
