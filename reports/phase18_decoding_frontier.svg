<rect x="70" y="630" width="1040" height="76" rx="8" fill="#f8fafc" stroke="#d0d5dd"/>
<text x="90" y="655" font-size="12" font-weight="700">Descriptive only — not a latency ranking</text>
<text x="90" y="677" font-size="11" class="muted">Phase 13 saw ~50% p50 movement between runs with byte-identical answers. Machine load can move points more than the apparent model gap.</text>
<text x="90" y="694" font-size="11" class="muted">Latency uses completed rows only; points below 100% coverage are not comparable on the x axis.</text>
</svg>
