[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultledger"
version = "0.1.0"
description = "Privacy-first, local-first financial-document Q&A with a rigorous evals harness."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Abhinav Gupta" }]

[project.urls]
Homepage = "https://cent.capital"
Repository = "https://github.com/Cent-Capital/VaultLedger"
Issues = "https://github.com/Cent-Capital/VaultLedger/issues"
Documentation = "https://github.com/Cent-Capital/VaultLedger/blob/main/docs/README.md"

# Track-A runtime dependencies. Heavy optional integrations stay in extras.
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyyaml>=6.0.3,<7",
    # Streamlit 1.62 excludes the broken PyArrow 25.0.0 release while supporting
    # the fixed 25.0.1 line. Keep these bounds aligned when either package moves.
    "streamlit>=1.62,<2",
    "pyarrow>=25.0.1,<26",
    # Phase 2 — ingestion & indexing
    "pdfplumber>=0.11.10,<1",
    "chromadb>=1.5,<2",
    "rank-bm25>=0.2.2,<0.3",
    "presidio-analyzer>=2.2.364,<3",
    "presidio-anonymizer>=2.2.364,<3",
    "requests>=2.34.2,<3",
    # NOTE: PII tagging also needs the spaCy model:
    #   python -m spacy download en_core_web_sm   (make install does this)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16.4,<1",
]
# Synthetic-corpus generation (Phase 1). Kept out of the runtime deps: the app
# reads pre-generated PDFs; only regeneration needs these.
synth = [
    "fpdf2>=2.8.8,<3",  # pinned: PDF bytes must stay stable for the byte-identity AC
]
rerank = [
    "sentence-transformers>=6.0,<7",  # BAAI/bge-reranker-base; model downloaded on first use
]
gateway = [
    "litellm>=1.97,<2",
]
graph = [
    # Phase 15 pins the current minor line: the embedded SDK is explicitly
    # version-sensitive, while deterministic graph scoring is provider-neutral.
    "lightrag-hku>=1.5.6,<1.6",
    "networkx>=3.6,<4",
    "aiohttp>=3.14,<4",  # explicit local HTTP binding; no runtime auto-install
]
observability = [
    "langfuse>=4.14,<5",
    # Keep the optional HTTP exporter on the same current OpenTelemetry line as
    # Chroma's gRPC exporter so one environment does not resolve split SDKs.
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]
# Phase 5  (structured out):   none added — native Ollama JSON `format` +
#                              hand-rolled repair loop instead of instructor (ADR-0002)
# Phase 8: local traces are built in; `observability` adds optional Langfuse export
# Phase 11: LiteLLM is isolated in the `gateway` extra; `make install` includes it.
# Phase 15 (graph):            isolated in the `graph` extra

[tool.setuptools.packages.find]
include = ["vaultledger*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `scripts/` is executable product code (the Phase 17 launcher) but is not an
# installed package, so tests/test_phase17.py can only import it when the repo
# root is on sys.path. `make test` gets that for free from `python -m pytest`;
# CI runs bare `pytest`, which does not. Without this, collection fails and the
# whole suite is skipped on CI.
pythonpath = ["."]
