[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultledger"
version = "0.1.0"
description = "Privacy-first, local-first financial-document Q&A with a rigorous evals harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Abhinav Gupta" }]
classifiers = ["License :: Other/Proprietary License"]

# Track-A runtime dependencies. Heavy optional integrations stay in extras.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "streamlit>=1.33",
    # Phase 2 — ingestion & indexing
    "pdfplumber>=0.11",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "requests>=2.31",
    # NOTE: PII tagging also needs the spaCy model:
    #   python -m spacy download en_core_web_sm   (make install does this)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Synthetic-corpus generation (Phase 1). Kept out of the runtime deps: the app
# reads pre-generated PDFs; only regeneration needs these.
synth = [
    "fpdf2>=2.8,<3",  # pinned: PDF bytes must stay stable for the byte-identity AC
]
rerank = [
    "sentence-transformers>=3.0,<6",  # BAAI/bge-reranker-base; model downloaded on first use
]
gateway = [
    "litellm>=1.74,<2",
]
observability = [
    "langfuse>=4.0,<5",
    # Langfuse pulls the OTLP *http* exporter; chromadb's installed OTLP *grpc*
    # exporter pins opentelemetry-{proto,sdk,common} to its own exact version.
    # Unconstrained, pip resolves http to the newer line and `pip check` breaks
    # (both exporters pin, incompatibly). Keep this matched to the grpc exporter
    # version and re-check on any chromadb bump. Verified clean at 1.43.0.
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
]
# Phase 5  (structured out):   none added — native Ollama JSON `format` +
#                              hand-rolled repair loop instead of instructor (ADR-0002)
# Phase 8: local traces are built in; `observability` adds optional Langfuse export
# Phase 11: LiteLLM is isolated in the `gateway` extra; `make install` includes it.
# Phase 15 (graph):            lightrag-hku, networkx

[tool.setuptools.packages.find]
include = ["vaultledger*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
